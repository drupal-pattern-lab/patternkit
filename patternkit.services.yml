parameters:
  # Configuration options to influence behavior of the Patternkit modules.
  patternkit.config:

    # This may be enabled to toggle debug features in the module.
    debug: false

    # Various operational features of the module may be toggled here.
    features:

      # Enable this to bypass cache loading of pattern definitions and
      # rediscover patterns during every request.
      bypass_pattern_cache: false

      # Enable this to bypass loading of pattern schemas and templates
      # from saved pattern entities in the database. When enabled, each
      # block will ignore the referenced database Pattern entity and load
      # the pattern directly from the available parser definition instead.
      bypass_database_cache: false

services:
  logger.channel.patternkit:
    parent: logger.channel_base
    arguments: ['patternkit']
  path_processor.patterns:
    class: Drupal\patternkit\PathProcessor\PathProcessorPatterns
    tags:
      - { name: path_processor_inbound, priority: 200 }
  patternkit.asset.library:
    class: Drupal\patternkit\Asset\Library
    arguments: ['@cache.discovery', '@config.factory', '@lock', '@patternkit.pattern.discovery', '@patternkit.library.namespace_resolver']
    deprecated: 'The "%service_id%" service is deprecated. Use "patternkit.library.namespace_resolver" or "patternkit.pattern.discovery" instead.'
  patternkit.asset.library.parser.base:
    abstract: true
    arguments:
      - '@serialization.json'
      - '%app.root%'
      - '@module_handler'
      - '@theme.manager'
      - '@stream_wrapper_manager'
      - '@library.libraries_directory_file_finder'
      - '@extension.path.resolver'
      - '@entity_type.manager'
      - '@patternkit.schema.data_preprocessor.factory'
      - '@patternkit.pattern.dependency_resolver'
      - '@logger.channel.patternkit'
  patternkit.asset.library.parser.file:
    parent: patternkit.asset.library.parser.base
    class: Drupal\patternkit\Asset\PatternLibraryParser\FilePatternLibraryParser
  patternkit.asset.library.parser.json:
    parent: patternkit.asset.library.parser.base
    class: Drupal\patternkit\Asset\PatternLibraryParser\JSONPatternLibraryParser
  patternkit.asset.library.parser.twig:
    parent: patternkit.asset.library.parser.base
    class: Drupal\patternkit\Asset\PatternLibraryParser\TwigPatternLibraryParser
  patternkit.library.namespace_resolver:
    class: Drupal\patternkit\Asset\LibraryNamespaceResolver
    arguments:
      - '@service_container'
      - '@library.discovery'
      - '@cache.discovery'
      - '@lock'
      - '@stream_wrapper_manager'
    tags:
      - { name: needs_destruction }
  patternkit.pattern.discovery:
    class: Drupal\patternkit\Asset\PatternDiscovery
    arguments: [ '@patternkit.pattern.discovery.collector', '@patternkit.library.namespace_resolver']
  patternkit.pattern.discovery.collector:
    class: Drupal\patternkit\Asset\PatternDiscoveryCollector
    arguments: [ '@cache.discovery', '@lock', '@patternkit.library.namespace_resolver', '@plugin.manager.library.pattern', '@logger.channel.patternkit']
    calls:
      - ['setPatternkitEnvironment', ['@patternkit.environment'] ]
    tags:
      - { name: needs_destruction }
  patternkit.pattern.dependency_resolver:
    class: Drupal\patternkit\Asset\PatternDependencyResolver
    arguments:
      - '@patternkit.pattern.discovery'
      - '@entity_type.manager'
      - '@patternkit.schema.data_preprocessor.factory'
      - '@logger.channel.patternkit'
    calls:
      - ['setContextBuilder', ['@patternkit.schema.context_builder']]
  patternkit.pattern.repository:
    class: Drupal\patternkit\PatternRepository
    arguments:
      - '@patternkit.pattern.discovery'
      - '@patternkit.pattern.dependency_resolver'
      - '@patternkit.schema.data_preprocessor.factory'
      - '@entity_type.manager'
    calls:
      - ['setContextBuilder', ['@patternkit.schema.context_builder']]
  plugin.manager.library.pattern:
    class: Drupal\patternkit\PatternLibraryPluginManager
    arguments: ['@container.namespaces', '@cache.discovery', '@module_handler', '@theme_handler']
  stream_wrapper.library:
    class: Drupal\patternkit\StreamWrapper\LibraryStream
    tags:
      - { name: stream_wrapper, scheme: library }
  stream_wrapper.patternkit:
    class: Drupal\patternkit\StreamWrapper\PatternkitStream
    tags:
      - { name: stream_wrapper, scheme: patternkit }
  twig.loader.patternlibrary:
    class: Drupal\patternkit\Loader\PatternLibraryLoader
    # We use '.' instead of '@app.root' as the path for non-namespaced template
    # files so that they match the relative paths of templates loaded via the
    # theme registry or via Twig namespaces.
    arguments: ['.', '@logger.channel.patternkit', '@patternkit.library.namespace_resolver']
    tags:
      - { name: twig.loader, priority: 100 }
  patternkit.translate_layout_builder_block:
    class: Drupal\patternkit\Routing\PatternkitTranslateBlockFormRouteSubscriber
    tags:
      - { name: event_subscriber }
  patternkit.environment:
      class: Drupal\patternkit\PatternkitEnvironment
      arguments: ['%patternkit.config%']
  plugin.manager.pattern_field_processor:
    class: Drupal\patternkit\PatternFieldProcessorPluginManager
    arguments:
      - '@container.namespaces'
      - '@cache.discovery'
      - '@module_handler'
      - '@serialization.json'
      - '@patternkit.schema.schema_walker_factory'
      - '@logger.channel.patternkit'
  patternkit.schema.schema_factory:
    class: Drupal\patternkit\Schema\SchemaFactory
    arguments:
      - '@patternkit.schema.context_builder'
  patternkit.schema.context_builder:
    class: Drupal\patternkit\Schema\ContextBuilder
    arguments:
      - '@patternkit.schema.ref_provider'
      - '@patternkit.schema.data_preprocessor.defaults'
  patternkit.schema.ref_handler:
    class: Drupal\patternkit\Schema\SchemaRefHandler
  patternkit.schema.ref_provider:
    class: Drupal\patternkit\Schema\PatternkitRefProvider
    arguments:
      - '@patternkit.schema.ref_handler'
      - '@logger.channel.patternkit'
    public: false
  patternkit.schema.schema_walker_factory:
    class: Drupal\patternkit\Schema\SchemaWalkerFactory
    arguments:
      - '@patternkit.schema.schema_factory'
    public: false

  # Collect default data preprocessors for general usage.
  patternkit.schema.data_preprocessor.defaults:
    class: Drupal\patternkit\Schema\DataPreProcessor\DataPreProcessorCollection
    tags:
      - { name: 'service_collector', tag: 'default_schema_data_preprocessor', call: 'addPreProcessor'}

  # Define schema data preprocessors used for various operations.
  patternkit.schema.data_preprocessor.factory:
    class: Drupal\patternkit\Schema\DataPreProcessorFactory
    tags:
      - { name: 'service_collector', tag: 'schema_data_preprocessor', call: 'addPreProcessor' }
  patternkit.schema.data_preprocessor.objects:
    class: Drupal\patternkit\Schema\DataPreProcessor\ObjectCoercionDataPreProcessor
    tags:
      - { name: 'schema_data_preprocessor', alias: 'objects' }
      - { name: 'default_schema_data_preprocessor' }
    public: false
  patternkit.schema.data_preprocessor.tokens:
    class: Drupal\patternkit\Schema\DataPreProcessor\TokenValidationDataPreProcessor
    arguments:
      - '@token'
    tags:
      - { name: 'schema_data_preprocessor', alias: 'tokens' }
      - { name: 'default_schema_data_preprocessor' }
    public: false
  patternkit.schema.data_preprocessor.bundler:
    class: Drupal\patternkit\Schema\DataPreProcessor\BundleReferenceDataPreProcessor
    arguments:
      - '@patternkit.schema.ref_handler'
    tags:
      - { name: 'schema_data_preprocessor', alias: 'bundler' }
    public: false
  patternkit.schema.data_preprocessor.normalizer:
    class: Drupal\patternkit\Schema\DataPreProcessor\RefNormalizerDataPreProcessor
    arguments:
      - '@patternkit.schema.ref_handler'
    tags:
      - { name: 'schema_data_preprocessor', alias: 'normalizer' }
    public: false
  patternkit.schema.data_preprocessor.ref_observer:
    class: Drupal\patternkit\Schema\DataPreProcessor\SchemaRefObserver
    arguments:
      - '@patternkit.schema.ref_handler'
    tags:
      - { name: 'schema_data_preprocessor', alias: 'ref_observer' }
    public: false
