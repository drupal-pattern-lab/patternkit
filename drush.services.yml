services:
  patternkit.commands:
    class: Drupal\patternkit\Commands\PatternkitCommands
    arguments:
      - '@entity_type.manager'
      - '@patternkit.pattern.repository'
      - '@cache_tags.invalidator'
      - '@patternkit.helper.update'
      - '%app.root%'
      - '@patternkit.layout_batch_manager'
    tags:
      - { name: drush.command }

  patternkit.commands.inspection:
    class: Drupal\patternkit\Commands\InspectionCommands
    arguments: ['@patternkit.pattern.repository']
    tags:
      - { name: drush.command }
