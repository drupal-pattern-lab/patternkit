services:
  _defaults:
    autoconfigure: true

  logger.channel.patternkit_media_library:
    parent: logger.channel_base
    arguments: [ 'patternkit_media_library' ]

  patternkit.opener.jsonlibrary:
    class: Drupal\patternkit_media_library\MediaLibraryJSONLibraryOpener
    arguments:
      - '@entity_type.manager'
      - '@file_url_generator'
    tags:
      - { name: media_library.opener }

  patternkit_media_library.media_attributes:
    class: Drupal\patternkit_media_library\MediaAttributeService
    arguments: ['@entity_type.manager', '@file_url_generator', '@entity_type.bundle.info', '@request_stack']
