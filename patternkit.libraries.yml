#cspell:ignore nonmin
jsoneditor:
  version: VERSION
  js:
    js/handlebars.min.js: { minified: true }
    js/ajv.min.js: { minified: true }
    js/jsoneditor.js: { minified: true }

jsoneditor.dev:
  version: VERSION
  js:
    js/handlebars.js: {}
    js/ajv.min.js: {}
    js/ajv.min.js.map: {}
    js/nonmin/jsoneditor.js: {}
    js/nonmin/jsoneditor.js.map: {}

patternkit.jsoneditor:
  version: VERSION
  css:
    theme:
      css/patternkit.css: {}
  js:
    js/patternkit.jsoneditor.js:
      attributes:
        type: 'module'
  dependencies:
    - core/drupal.dialog
    - core/drupal.dialog.ajax
    - core/drupal.editor
    - core/drupalSettings
    - core/drupal.debounce
    - core/jquery
    - core/once
    - patternkit/jsoneditor

cygnet:
  version: VERSION
  css:
    theme:
      css/cygnet/cygnet.css: {}

cygnet_no_shadow_dom:
  version: VERSION
  css:
    theme:
      css/cygnet/cygnet--prefixed-for-drupal--upstream.css: {}
      css/cygnet/cygnet--prefixed-for-drupal.css: {}
      css/cygnet/cygnet--overrides.css: {}

icons.fontawesome3:
  version: 3.2.1
  css:
    theme:
      'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/3.2.1/css/font-awesome.css':
        type: external
        minified: true

icons.fontawesome4:
  version: 4.0.3
  css:
    theme:
      'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.0.3/css/font-awesome.css':
        type: external
        minified: true

icons.fontawesome5:
  version: 5.6.1
  css:
    theme:
      'https://use.fontawesome.com/releases/v5.6.1/css/all.css':
        type: external
        minified: true
