patternkit.settings:
  type: config_object
  label: 'Patternkit Module Settings'
  mapping:
    patternkit_json_editor_css:
      type: string
      label: 'Comma-separated string of stylesheet files to load with the JSON Editor.'
    patternkit_json_editor_icons:
      type: string
      label: 'String selecting the icon set to be used for the JSON Editor.'
    patternkit_json_editor_js:
      type: string
      label: 'Comma-separated string of Javascript files to load with the JSON Editor.'
    patternkit_json_editor_theme:
      type: string
      label: 'String selecting the theme to be used for the JSON Editor.'
    patternkit_libraries:
      type: sequence
      label: 'Patternkit library settings keyed by library ID.'
      orderby: key
      sequence:
        type: mapping
        label: 'Library setting'
        mapping:
          enabled:
            type: boolean
            label: 'Library Enabled'
          visible:
            type: boolean
            label: 'Library visible in lists'
    entity_cache_tag_invalidation:
      type: boolean
      label: 'Boolean determining whether Pattern entity cache tags are invalidated during Pattern updates.'
    render_validation_on_save:
      type: boolean
      label: 'Boolean determining whether invalid pattern configuration is blocked at save time.'
    patternkit_json_editor_wysiwyg:
      type: string
      label: 'String selecting the WYSIWYG tool to use in the JSON Editor.'
    patternkit_json_editor_ckeditor_toolbar:
      type: string
      label: 'String selecting the CKEditor text format to use for CKEditor inside the JSON Editor.'
    patternkit_json_editor_token_clear:
      type: boolean
      label: 'Boolean that determines whether tokens without matching content in strings should be removed.'
    patternkit_json_editor_disable_properties_buttons:
      type: boolean
      label: 'Boolean that determines whether to show the properties buttons.'
    patternkit_json_editor_disable_edit_json_button:
      type: boolean
      label: 'Boolean that determines whether to show the JSON Edit button.'
    patternkit_json_editor_cache_schemas:
      type: boolean
      label: 'Boolean that determines whether to cache external schema responses.'

block.settings.patternkit_block:*:
  type: block_settings
  mapping:
    pattern:
      type: integer
      label: 'Revision ID of the pattern in use on the block.'
    reusable:
      type: string
      label: 'Reusable property of the pattern in use on the block.'
    patternkit_block_id:
      type: integer
      label: 'ID of the Patternkit Block content entity.'
    patternkit_block_rid:
      type: integer
      label: 'Revision ID of the Patternkit Block content entity.'
    presentation_style:
      type: string
      label: 'Presentation style for the patternkit block when rendered.'
    version:
      type: string
      label: 'Version of the pattern or containing library.'
    block_serialized:
      type: string
      label: 'Serialized block'
  form_element_class: 'Drupal\patternkit\FormElement\PatternkitJson'
